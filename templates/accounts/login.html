{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Sa Chat</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/interactive-effects.css' %}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <h1>Connexion</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="auth-field">
                <label for="username">Nom d'utilisateur</label>
                <input id="username" type="text" name="username" required>
            </div>

            <div class="auth-field password-field">
                <label for="password">Mot de passe</label>
                <div class="password-input-wrap"><input id="password" type="password" name="password" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Afficher le mot de passe"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
            </div>

            <div class="auth-actions">
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </div>
        </form>

        <p class="auth-note">
            Pas encore de compte ?
            <a href="{% url 'register' %}" class="auth-link">Créer un compte</a>
        </p>
        <p class="auth-note"><a href="{% url 'password_reset' %}" class="auth-link">Mot de passe oublié ?</a></p>
    </div>
    <script src="{% static 'js/main.js' %}" defer></script>
    <script src="{% static 'js/interactive-effects.js' %}" defer></script>
</body>
</html>
