{% extends "base.html" %}

{% block title %}Paramètres - Sa Chat{% endblock %}

{% block content %}
<section class="panel-card simple-panel">
    <div class="page-header"><div><p class="eyebrow">Compte</p><h1>Paramètres</h1></div></div>
    <form method="post" enctype="multipart/form-data" class="form-card">
        {% csrf_token %}
        <input type="hidden" name="form_type" value="profile">
        <div class="auth-field"><label for="username">Nom d'utilisateur</label><input id="username" name="username" value="{{ user.username }}" required></div>
        <div class="auth-field"><label for="email">Adresse e-mail</label><input id="email" type="email" name="email" value="{{ user.email }}"></div>
        <div class="auth-field"><label for="first_name">Prénom</label><input id="first_name" name="first_name" value="{{ user.first_name }}"></div>
        <div class="auth-field"><label for="last_name">Nom</label><input id="last_name" name="last_name" value="{{ user.last_name }}"></div>
        <div class="auth-field"><label for="bio">Biographie</label><textarea id="bio" name="bio" rows="4">{{ profile_data.bio }}</textarea></div>
        <div class="auth-field"><label for="presentation">Présentation courte</label><input id="presentation" name="presentation" value="{{ profile_data.presentation }}"></div>
        <div class="auth-field"><label for="interests">Centres d'intérêt</label><input id="interests" name="interests" value="{{ profile_data.interests }}" placeholder="Design, sport, entrepreneuriat"></div>
        <div class="auth-field"><label for="theme">Thème</label><select id="theme" name="theme"><option value="light" {% if profile_data.theme == "light" %}selected{% endif %}>Clair</option><option value="dark" {% if profile_data.theme == "dark" %}selected{% endif %}>Sombre</option></select></div>
        <div class="auth-field"><label for="avatar">Photo de profil</label><input id="avatar" type="file" name="avatar" accept="image/*"></div>
        <label class="checkbox-field"><input type="checkbox" name="is_private" {% if profile_data.is_private %}checked{% endif %}> Profil privé</label>
        <div class="form-actions inline-actions"><button type="submit" class="btn btn-primary">Enregistrer les modifications</button></div>
    </form>
    <form method="post" action="{% url 'logout' %}" class="form-actions">{% csrf_token %}<button type="submit" class="btn btn-danger">Déconnexion</button></form>
</section>
<section class="panel-card simple-panel">
    <div class="page-header"><div><p class="eyebrow">Sécurité</p><h2>Changer le mot de passe</h2></div></div>
    <form method="post" class="form-card">{% csrf_token %}<input type="hidden" name="form_type" value="password">{{ password_form.as_p }}<button type="submit" class="btn btn-primary">Modifier le mot de passe</button></form>
</section>
{% endblock %}
